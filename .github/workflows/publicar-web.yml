# Publica la página de Monte Riko en el hosting (2dweb / Ferozo) por FTP con TLS.
# Solo corre cuando se sube algo a la rama `publicar-web`, y eso se hace
# únicamente cuando Tomás dice "subilo". Sube solo monte-riko/pagina-web/.
# Usa lftp porque el servidor de Ferozo exige reusar la sesión TLS en la
# conexión de datos, y FTP-Deploy-Action se cortaba con ECONNRESET (octubre 2026).
name: Publicar página web

on:
  push:
    branches: [publicar-web]
  workflow_dispatch:

concurrency:
  group: publicar-web
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # el hosting deja el CSS y el JS 7 días en la caché del navegador: sin esto, quien ya
      # visitó la página ve el HTML nuevo con el CSS y el JS viejos (octubre 2026).
      # Se marca con un pedazo del hash de cada archivo, solo en la copia que se sube.
      - name: Marcar la versión del CSS y el JS
        working-directory: monte-riko/pagina-web
        run: |
          css=$(sha256sum assets/styles.css | cut -c1-10)
          js=$(sha256sum assets/main.js | cut -c1-10)
          sed -i "s|href=\"assets/styles.css\"|href=\"assets/styles.css?v=$css\"|; s|src=\"assets/main.js\"|src=\"assets/main.js?v=$js\"|" index.html
          grep -q "assets/styles.css?v=$css" index.html
          grep -q "assets/main.js?v=$js" index.html

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Subir monte-riko/pagina-web al hosting
        env:
          FTP_SERVIDOR: ${{ secrets.FTP_SERVIDOR }}
          FTP_USUARIO: ${{ secrets.FTP_USUARIO }}
          FTP_CONTRASENA: ${{ secrets.FTP_CONTRASENA }}
          FTP_CARPETA: ${{ vars.FTP_CARPETA || '/public_html/' }}
        # sube lo nuevo o cambiado; no borra nada del servidor
        run: |
          lftp -u "$FTP_USUARIO,$FTP_CONTRASENA" -p 21 "$FTP_SERVIDOR" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --verbose --parallel=4 ./monte-riko/pagina-web/ "$FTP_CARPETA"
          bye
          EOF
