<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Portadas de destacadas</title>
<!-- Portadas de las destacadas de Instagram (noviembre 2026). 1080x1920, negro con el ícono naranja en el centro:
     Instagram la recorta en un círculo chico, así que todo va dentro de los 700 px del medio.
     Se abre con ?s=1 y se saca una captura de 1080x1920. -->
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
  section{display:none;position:relative;width:1080px;height:1920px;background:#000}
  section.activa{display:block}
  .icono{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style></head><body>

<!-- 1 · Pedí acá: bolsa naranja con la corona oficial -->
<section>
  <svg class="icono" width="620" height="620" viewBox="0 0 620 620">
    <path d="M220 230 V185 a90 90 0 0 1 180 0 V230" fill="none" stroke="#FF6900" stroke-width="40" stroke-linecap="round"/>
    <path d="M120 215 H500 L530 560 a24 24 0 0 1 -24 26 H114 a24 24 0 0 1 -24 -26 Z" fill="#FF6900" stroke="#FF6900" stroke-width="20" stroke-linejoin="round"/>
    <image href="../logo/Monteriko-icono-negro-v03.svg" x="142" y="262" width="336" height="315"/>
  </svg>
</section>

<!-- 2 · Precios: etiqueta de precio naranja con el agujerito y la corona -->
<section>
  <svg class="icono" width="620" height="620" viewBox="0 0 620 620">
    <path d="M60 310 L200 170 H540 a30 30 0 0 1 30 30 V420 a30 30 0 0 1 -30 30 H200 Z" fill="#FF6900" stroke="#FF6900" stroke-width="24" stroke-linejoin="round"/>
    <circle cx="180" cy="310" r="30" fill="#000"/>
    <image href="../logo/Monteriko-icono-negro-v03.svg" x="268" y="198" width="240" height="225"/>
  </svg>
</section>

<!-- 3 · Envíos: camioncito naranja con la corona en la caja -->
<section>
  <svg class="icono" width="620" height="620" viewBox="0 0 620 620">
    <g transform="translate(0 -36)">
      <rect x="40" y="160" width="360" height="290" rx="26" fill="#FF6900"/>
      <path d="M420 250 H520 L585 340 V450 H420 Z" fill="#FF6900" stroke="#FF6900" stroke-width="20" stroke-linejoin="round"/>
      <path d="M448 280 H505 L548 338 H448 Z" fill="#000"/>
      <circle cx="140" cy="470" r="76" fill="#000"/>
      <circle cx="140" cy="470" r="54" fill="#FF6900"/>
      <circle cx="140" cy="470" r="18" fill="#000"/>
      <circle cx="490" cy="470" r="76" fill="#000"/>
      <circle cx="490" cy="470" r="54" fill="#FF6900"/>
      <circle cx="490" cy="470" r="18" fill="#000"/>
      <image href="../logo/Monteriko-icono-negro-v03.svg" x="105" y="180" width="230" height="216"/>
    </g>
  </svg>
</section>

<script>
  var n = Number(new URLSearchParams(location.search).get('s')) || 1;
  document.querySelectorAll('section')[n - 1].classList.add('activa');
</script>
</body></html>
