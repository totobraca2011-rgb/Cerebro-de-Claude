<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --naranja: #ff6900;
        --negro: #000000;
        --arena: #ebd9c5;
        --font-display: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #2a1a12; }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      #escena { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }

      /* Subtítulo palabra por palabra, blanco grueso con borde negro */
      .sub { position: absolute; left: 0; right: 0; top: 1190px; text-align: center; z-index: 5; }
      .sub span {
        display: inline-block; margin: 0 0.14em; font-weight: 900; font-size: 92px; color: #fff; letter-spacing: -0.01em;
        -webkit-text-stroke: 10px #000; paint-order: stroke fill;
        text-shadow: 0 8px 0 rgba(0,0,0,.35);
      }
      .sub span.clave { color: var(--naranja); }

      /* Tarjeta del paso */
      #tarjeta { position: absolute; left: 140px; right: 140px; top: 250px; z-index: 6; display: flex; justify-content: center; }
      #tarjeta-caja {
        display: flex; align-items: center; gap: 26px; background: #fffaf3; border-radius: 30px;
        padding: 26px 40px 26px 30px; box-shadow: 0 18px 40px rgba(0,0,0,.35);
      }
      #tarjeta-num {
        width: 92px; height: 92px; border-radius: 50%; background: var(--naranja); color: #1d120c;
        display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 54px;
      }
      #tarjeta-txt small { display: block; font-weight: 700; font-size: 30px; letter-spacing: .12em; color: #8a6a55; }
      #tarjeta-txt b { display: block; font-weight: 900; font-size: 58px; color: #1d120c; line-height: 1.05; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <canvas id="escena" width="1080" height="1920"></canvas>

      <div id="sub-1" class="sub clip" data-start="0" data-duration="1.6" data-track-index="2">
        <span id="w1">Así</span> <span id="w2">se</span> <span id="w3">hace</span>
      </div>
      <div id="sub-2" class="sub clip" data-start="1.5" data-duration="3.5" data-track-index="2">
        <span id="w4">un</span> <span id="w5" class="clave">alfajor</span>
      </div>

      <div id="tarjeta" class="clip" data-start="2.2" data-duration="2.8" data-track-index="3">
        <div id="tarjeta-caja">
          <div id="tarjeta-num">1</div>
          <div id="tarjeta-txt"><small>PASO</small><b>La masa</b></div>
        </div>
      </div>
    </div>

    <script>
      // La escena 3D se arma en un módulo; el render espera a que esté lista.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["escena"] = new Promise((r) => (window.__escenaLista = r));

      const tl = gsap.timeline({ paused: true });
      const pop = (sel, t) =>
        tl.fromTo(sel, { scale: 0.4, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.22, ease: "back.out(2.4)" }, t);
      // El primer cuadro es la portada: "Así se hace" ya está en pantalla y solo late
      tl.fromTo("#sub-1 span", { scale: 1 }, { scale: 1.08, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.12 }, 0.15);
      pop("#w4", 1.5); pop("#w5", 1.75);
      tl.fromTo("#tarjeta-caja", { scale: 0.6, opacity: 0, y: -40 }, { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.8)" }, 2.2);
      tl.fromTo("#tarjeta-num", { rotation: -90 }, { rotation: 0, duration: 0.45, ease: "power3.out" }, 2.25);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>

    <script type="module">
      import * as THREE from "./assets/lib/three.module.min.js";

      const canvas = document.getElementById("escena");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(2); // se dibuja al doble y se achica: bordes más finos
      renderer.setSize(1080, 1920, false);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#3a2418");
      scene.fog = new THREE.Fog("#3a2418", 14, 30);

      const camera = new THREE.PerspectiveCamera(34, 1080 / 1920, 0.1, 100);

      // Luz cálida principal, relleno frío suave y luz de cielo
      const key = new THREE.DirectionalLight("#ffd2a1", 2.6);
      key.position.set(4, 8, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(4096, 4096);
      key.shadow.camera.left = -6; key.shadow.camera.right = 6;
      key.shadow.camera.top = 6; key.shadow.camera.bottom = -6;
      key.shadow.radius = 6;
      key.shadow.bias = -0.0008;
      scene.add(key);
      const rim = new THREE.DirectionalLight("#9fc4ff", 0.7);
      rim.position.set(-5, 4, -6);
      scene.add(rim);
      scene.add(new THREE.HemisphereLight("#ffe9d2", "#4a2a1a", 0.9));

      const mat = (c, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.75, ...extra });

      // Mesada de madera con tablas
      const mesada = new THREE.Group();
      for (let i = 0; i < 7; i++) {
        const tabla = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.4, 9), mat(i % 2 ? "#b9824f" : "#a87143"));
        tabla.position.set(-4.3 + i * 1.44, -0.2, 0);
        tabla.receiveShadow = true;
        mesada.add(tabla);
      }
      scene.add(mesada);

      // Tabla de amasar
      const tablaAmasar = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.14, 2.6), mat("#e2c39b"));
      tablaAmasar.position.set(0.3, 0.07, 0.6);
      tablaAmasar.castShadow = true; tablaAmasar.receiveShadow = true;
      scene.add(tablaAmasar);

      // Bolsa de harina de fondo
      const bolsa = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.3, 0.6), mat("#f3ece2"));
      bolsa.position.set(-2.6, 0.65, -1.4); bolsa.rotation.y = 0.4; bolsa.castShadow = true;
      scene.add(bolsa);
      const etiqueta = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.36, 0.62), mat("#ff6900"));
      etiqueta.position.copy(bolsa.position); etiqueta.position.y = 0.7; etiqueta.rotation.y = 0.4;
      scene.add(etiqueta);

      // La masa: arranca como bollo y se estira
      const masa = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 6), mat("#5b3421", { roughness: 0.6 }));
      masa.castShadow = true; masa.receiveShadow = true;
      scene.add(masa);

      // El pastelero
      const pj = new THREE.Group();
      const blanco = mat("#f7f3ee"), piel = mat("#f0b58c"), negro = mat("#1a1a1a"), naranja = mat("#ff6900");
      const cuerpo = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.5, 1.0, 40), blanco);
      cuerpo.position.y = 0.95; cuerpo.castShadow = true;
      // Delantal: falda y pechera que siguen la forma del cuerpo, tira en la cintura, tiras al cuello y bolsillo
      const naranjaOscuro = mat("#d95500");
      const doble = { side: THREE.DoubleSide };
      const delantal = new THREE.Group();
      const falda = new THREE.Mesh(new THREE.CylinderGeometry(0.485, 0.535, 0.6, 48, 1, true, -1.05, 2.1), mat("#ff6900", doble));
      falda.position.y = 0.7; falda.castShadow = true;
      const pechera = new THREE.Mesh(new THREE.CylinderGeometry(0.448, 0.478, 0.38, 32, 1, true, -0.5, 1.0), mat("#ff6900", doble));
      pechera.position.y = 1.18; pechera.castShadow = true;
      const cintura = new THREE.Mesh(new THREE.CylinderGeometry(0.488, 0.49, 0.07, 64, 1, true), mat("#d95500", doble));
      cintura.position.y = 1.0;
      const tira = (lado) => {
        const t = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.26, 0.03), naranjaOscuro);
        t.position.set(0.19 * lado, 1.47, 0.33); t.rotation.set(-0.5, 0, 0.35 * lado); return t;
      };
      // Logo oficial (versión blanca) estampado en la falda, siguiendo su curva
      const logoCanvas = document.createElement("canvas"); logoCanvas.width = 1230; logoCanvas.height = 500;
      const logoTex = new THREE.CanvasTexture(logoCanvas);
      logoTex.colorSpace = THREE.SRGBColorSpace; logoTex.anisotropy = 8;
      const logoListo = new Promise((ok) => {
        const img = new Image();
        img.onload = () => { logoCanvas.getContext("2d").drawImage(img, 0, 0, 1230, 500); logoTex.needsUpdate = true; ok(); };
        img.onerror = () => ok();
        img.src = "assets/logo-blanco.svg";
      });
      const logoAlto = 0.29, logoY = 0.7, rFalda = (y) => 0.535 - 0.05 * (y - 0.4) / 0.6 + 0.004;
      const logoAng = 0.71 / rFalda(logoY);
      const logo = new THREE.Mesh(
        new THREE.CylinderGeometry(rFalda(logoY + logoAlto / 2), rFalda(logoY - logoAlto / 2), logoAlto, 32, 1, true, -logoAng / 2, logoAng),
        new THREE.MeshStandardMaterial({ map: logoTex, emissive: "#ffffff", emissiveMap: logoTex, emissiveIntensity: 0.35, transparent: true, roughness: 0.8, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 })
      );
      logo.position.y = logoY;
      delantal.add(falda, pechera, cintura, tira(-1), tira(1), logo);
      const piernaI = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.5, 20), mat("#2d2d36"));
      piernaI.position.set(-0.18, 0.25, 0); piernaI.castShadow = true;
      const piernaD = piernaI.clone(); piernaD.position.x = 0.18;
      const cabezaG = new THREE.Group(); cabezaG.position.y = 1.72;
      const cabeza = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 6), piel); cabeza.castShadow = true;
      const ojoI = new THREE.Mesh(new THREE.SphereGeometry(0.055, 20, 14), negro); ojoI.position.set(-0.14, 0.04, 0.38);
      const ojoD = ojoI.clone(); ojoD.position.x = 0.14;
      const nariz = new THREE.Mesh(new THREE.SphereGeometry(0.07, 20, 14), mat("#e89a72")); nariz.position.set(0, -0.06, 0.41);
      const gorroBase = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.34, 40), blanco); gorroBase.position.y = 0.42;
      const gorroPuff = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 6), blanco); gorroPuff.position.y = 0.72; gorroPuff.scale.set(1.05, 0.75, 1.05);
      gorroBase.castShadow = gorroPuff.castShadow = true;
      cabezaG.add(cabeza, ojoI, ojoD, nariz, gorroBase, gorroPuff);
      // Brazos desde el hombro, con la mano en la punta
      const brazo = (lado) => {
        const g = new THREE.Group(); g.position.set(0.5 * lado, 1.32, 0.05);
        const b = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 1, 20), blanco); b.position.y = -0.5; b.castShadow = true;
        const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.13, 4), piel); m.position.y = -1.0;
        const largo = new THREE.Group(); largo.add(b);
        g.add(largo, m); g.userData = { largo, mano: m }; return g;
      };
      // Apunta el brazo a un punto del mundo y lo estira lo justo para llegar
      const abajo = new THREE.Vector3(0, -1, 0), tmp = new THREE.Vector3();
      const apuntar = (br, objetivoMundo) => {
        tmp.copy(objetivoMundo); pj.worldToLocal(tmp); tmp.sub(br.position);
        const L = Math.min(1.25, Math.max(0.7, tmp.length()));
        br.quaternion.setFromUnitVectors(abajo, tmp.normalize());
        br.userData.largo.scale.y = L; br.userData.mano.position.y = -L;
      };
      const brazoI = brazo(-1), brazoD = brazo(1);
      pj.add(cuerpo, delantal, piernaI, piernaD, cabezaG, brazoI, brazoD);
      pj.position.set(0.3, 0.14, -0.78);
      scene.add(pj);

      // Palo de amasar
      const palo = new THREE.Group();
      const rodillo = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 1.5, 40), mat("#d9a86c")); rodillo.rotation.z = Math.PI / 2; rodillo.castShadow = true;
      const manijaI = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.36, 20), mat("#b07a44")); manijaI.rotation.z = Math.PI / 2; manijaI.position.x = -0.93;
      const manijaD = manijaI.clone(); manijaD.position.x = 0.93;
      palo.add(rodillo, manijaI, manijaD);
      scene.add(palo);

      // Harina que cae al principio (partículas con semilla fija)
      const seed = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
      const N = 110, polvo = [];
      const polvoMat = new THREE.MeshStandardMaterial({ color: "#fffaf0", roughness: 1 });
      for (let i = 0; i < N; i++) { const p = new THREE.Mesh(new THREE.SphereGeometry(0.018 + seed(i) * 0.02, 10, 8), polvoMat); scene.add(p); polvo.push(p); }

      const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
      const clamp01 = (x) => Math.min(1, Math.max(0, x));

      function renderAt(t) {
        // Cámara: entra desde arriba y se acerca, girando despacio
        const k = ease(t / 5);
        const ang = -0.55 + k * 0.5;
        const radio = 9.8 - k * 2.2;
        const alto = 7.2 - k * 2.0;
        camera.position.set(Math.sin(ang) * radio, alto, Math.cos(ang) * radio);
        camera.lookAt(0.2, 1.05 - k * 0.15, 0.1);

        // Masa: bollo en la tabla que rebota (0.2-0.6), se aplasta (0.9-1.3) y se estira con el palo (1.3-5)
        const rebote = Math.sin(clamp01((t - 0.2) / 0.4) * Math.PI) * 0.12;
        const aplasta = ease(clamp01((t - 0.9) / 0.4));
        const estira = ease(clamp01((t - 1.3) / 3.5));
        const ancho = 1 + aplasta * 0.5 + estira * 0.85;
        const alto2 = 1 - aplasta * 0.55 - estira * 0.25;
        masa.scale.set(ancho * (1 + rebote), alto2 * (1 - rebote), ancho * 0.8 * (1 + rebote));
        const masaZ = 0.4;
        masa.position.set(0.3, 0.14 + 0.5 * alto2 * (1 - rebote), masaZ);
        masa.rotation.y = t * 0.15;

        // Palo: lo levanta (0.9-1.3) y amasa ida y vuelta desde 1.3 s
        const activo = clamp01((t - 0.95) / 0.35);
        const vaiven = Math.sin((t - 1.3) * Math.PI * 1.8) * 0.32 * clamp01((t - 1.3) / 0.2);
        const sobreMasa = 0.14 + alto2 * 0.5 * 2 * 0.5 + 0.16;
        const reposo = new THREE.Vector3(0.3, 0.95, -0.25);
        const trabajo = new THREE.Vector3(0.3, sobreMasa + 0.02, masaZ + vaiven);
        palo.position.lerpVectors(reposo, trabajo, ease(activo));
        rodillo.rotation.x = -(vaiven / 0.16);

        // Cuerpo se inclina con el vaivén; la cabeza va primero y los brazos llegan a las manijas
        pj.rotation.x = 0.04 + ease(activo) * (0.26 + vaiven * 0.35);
        const respiro = Math.sin(t * Math.PI * 1.2) * 0.02;
        cuerpo.scale.set(1 + respiro, 1 - respiro, 1 + respiro);
        cabezaG.rotation.x = -0.05 + Math.sin((t - 1.15) * Math.PI * 1.8) * 0.1 * activo;
        cabezaG.rotation.y = Math.sin(t * 0.9) * 0.12 * (1 - activo) + 0.05;
        // Saltito de alegría al principio, con el palo en la mano
        const salto = Math.max(0, Math.sin(clamp01((t - 0.3) / 0.45) * Math.PI)) * 0.22;
        pj.position.y = 0.14 + salto;
        if (activo === 0) palo.position.y += salto;
        pj.updateMatrixWorld(true);
        apuntar(brazoI, new THREE.Vector3(palo.position.x - 0.78, palo.position.y, palo.position.z));
        apuntar(brazoD, new THREE.Vector3(palo.position.x + 0.78, palo.position.y, palo.position.z));

        // Harina: cae sobre la tabla en el primer segundo y queda
        for (let i = 0; i < N; i++) {
          const t0 = 0.1 + seed(i + 7) * 0.6;
          const f = clamp01((t - t0) / 0.7);
          const x = 0.3 + (seed(i + 31) - 0.5) * 2.6;
          const z = 0.6 + (seed(i + 59) - 0.5) * 2.0;
          polvo[i].position.set(x, 0.16 + (1 - ease(f)) * 3.2, z);
          polvo[i].rotation.set(i + t * 2 * (1 - f), i * 0.7, 0);
          polvo[i].visible = t >= t0;
        }
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__renderAt = renderAt;
      logoListo.then(() => { renderAt(0); window.__escenaLista(); });
    </script>
  </body>
</html>
